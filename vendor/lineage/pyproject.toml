[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lineage-lite"
version = "0.1.0"
description = "Lightweight dataset pipeline lineage tracking for local Python scripts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "data-lineage-lite contributors" }]
keywords = ["lineage", "data-quality", "reproducibility", "dataset", "provenance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
lineage = "lineage.cli:main"

[tool.setuptools]
packages = ["lineage"]

[tool.setuptools.package-data]
lineage = ["py.typed"]
