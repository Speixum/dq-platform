[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dqplat"
version = "0.1.0"
description = "Orchestration layer that drives six standalone data-tool repos through their CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dq-platform contributors" }]
keywords = ["data-quality", "data-lineage", "pii", "pipeline", "orchestration", "stdlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Speixum/dq-platform"
Source = "https://github.com/Speixum/dq-platform"

[project.scripts]
dqplat = "dqplat.cli:main"

[tool.setuptools]
packages = ["dqplat"]

[tool.setuptools.package-data]
dqplat = ["py.typed"]
